<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rentabilité">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <title>Rentabilité de projet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --card2: #f2f2f7;
      --blue: #007AFF;
      --green: #34C759;
      --red: #FF3B30;
      --orange: #FF9500;
      --gray: #8e8e93;
      --gray2: #c7c7cc;
      --text: #1d1d1f;
      --text2: #6e6e73;
      --radius: 18px;
      --shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .status-bar { height: env(safe-area-inset-top, 44px); background: var(--bg); }

    .header {
      padding: 12px 20px 8px;
    }

    .header-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .header-sub {
      font-size: 13px;
      color: var(--text2);
      margin-top: 2px;
    }

    /* Project switcher */
    .projects-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 16px 4px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .projects-bar::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 20px;
      background: var(--card);
      color: var(--text2);
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .chip.active {
      background: var(--blue);
      color: white;
    }

    .chip.add {
      color: var(--blue);
      background: var(--card2);
      font-weight: 700;
      box-shadow: none;
    }

    .section { margin: 0 16px 20px; }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text2);
      margin-bottom: 8px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-pad { padding: 16px; }

    /* Project name field */
    .project-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
    }

    .project-name-row input {
      flex: 1;
      font-size: 20px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card2);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--red);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Component rows */
    .component-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card2);
    }

    .component-row input[type="text"] {
      flex: 1.4;
      min-width: 0;
      font-size: 15px;
      border: none;
      background: var(--card2);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text);
      outline: none;
    }

    .component-row .price-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .component-row input[type="number"] {
      width: 100%;
      font-size: 15px;
      border: none;
      background: var(--card2);
      border-radius: 10px;
      padding: 9px 12px 9px 12px;
      padding-right: 22px;
      color: var(--text);
      outline: none;
      -moz-appearance: textfield;
    }

    .component-row input[type="number"]::-webkit-outer-spin-button,
    .component-row input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .price-wrap .unit {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text2);
      pointer-events: none;
    }

    .remove-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,59,48,0.1);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--red);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .add-row-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: none;
      color: var(--blue);
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .empty-hint {
      padding: 20px 16px;
      color: var(--text2);
      font-size: 14px;
      text-align: center;
    }

    .components-total {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card2);
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
    }

    .components-total span:last-child { color: var(--text); }

    /* Input fields (labelled) */
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--card2);
      gap: 10px;
    }
    .field-row:last-child { border-bottom: none; }

    .field-label {
      font-size: 15px;
      color: var(--text);
      flex-shrink: 0;
    }

    .field-label .field-hint {
      display: block;
      font-size: 12px;
      color: var(--text2);
      font-weight: 400;
      margin-top: 1px;
    }

    .field-input-wrap {
      position: relative;
      width: 130px;
      flex-shrink: 0;
    }

    .field-input-wrap input {
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      text-align: right;
      border: none;
      background: var(--card2);
      border-radius: 10px;
      padding: 9px 30px 9px 12px;
      color: var(--text);
      outline: none;
      -moz-appearance: textfield;
    }

    .field-input-wrap input::-webkit-outer-spin-button,
    .field-input-wrap input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field-input-wrap .unit {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      pointer-events: none;
    }

    .computed-line {
      padding: 10px 16px 14px;
      font-size: 13px;
      color: var(--text2);
      text-align: right;
    }

    .computed-line b { color: var(--blue); font-weight: 700; }

    /* Result hero */
    .result-hero {
      margin: 0 16px 16px;
      border-radius: var(--radius);
      padding: 22px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: linear-gradient(135deg, #34C759 0%, #248A3D 100%);
    }

    .result-hero.negative {
      background: linear-gradient(135deg, #FF3B30 0%, #B8291F 100%);
    }

    .result-deco {
      position: absolute;
      right: -16px;
      top: -16px;
      font-size: 100px;
      opacity: 0.1;
      pointer-events: none;
    }

    .result-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.85);
    }

    .result-value {
      font-size: 38px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.5px;
      margin-top: 4px;
    }

    .result-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      margin-top: 6px;
    }

    .result-breakdown {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .result-chip {
      background: rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .result-chip .rc-label {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .result-chip .rc-value {
      font-size: 16px;
      font-weight: 700;
      color: white;
      margin-top: 2px;
    }

    /* Detail table */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card2);
      font-size: 14px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .dr-label { color: var(--text2); }
    .detail-row .dr-value { font-weight: 600; color: var(--text); }
    .detail-row.total .dr-label,
    .detail-row.total .dr-value { color: var(--text); font-weight: 700; }
    .detail-row.negative .dr-value { color: var(--red); }

    .bottom-safe { height: calc(env(safe-area-inset-bottom, 0px) + 24px); }

    .no-projects {
      margin: 60px 20px;
      text-align: center;
      color: var(--text2);
    }

    .no-projects .np-emoji { font-size: 48px; display: block; margin-bottom: 12px; }

    .primary-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div class="status-bar"></div>

<div class="header">
  <div class="header-title">Rentabilité</div>
  <div class="header-sub">Calculez la marge de vos projets</div>
</div>

<div class="projects-bar" id="projects-bar"></div>

<div id="app-content"></div>

<div class="bottom-safe"></div>

<script>
  // ===== STORAGE =====
  const STORAGE_KEY = 'profitability_projects_v1';
  const CURRENT_KEY = 'profitability_current_v1';

  function loadProjects() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveProjects() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  }

  function saveCurrent() {
    localStorage.setItem(CURRENT_KEY, currentId || '');
  }

  function uid() {
    return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultProject(name) {
    return {
      id: uid(),
      name: name || 'Nouveau projet',
      components: [],
      salePriceUSD: 0,
      conversionRate: 0.92,
      chargesPercent: 0,
      quantity: 1
    };
  }

  let projects = loadProjects();
  let currentId = localStorage.getItem(CURRENT_KEY) || (projects[0] && projects[0].id) || null;

  if (projects.length === 0) {
    const p = defaultProject('Mon premier projet');
    projects.push(p);
    currentId = p.id;
    saveProjects();
    saveCurrent();
  }

  function getCurrent() {
    return projects.find(p => p.id === currentId) || null;
  }

  // ===== FORMATTING =====
  const fmtEUR = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
  const fmtUSD = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
  const fmtPct = (n) => `${n.toFixed(1).replace(/\.0$/, '')} %`;

  // ===== RENDER: PROJECT TABS =====
  function renderProjectsBar() {
    const bar = document.getElementById('projects-bar');
    bar.innerHTML = '';

    projects.forEach(p => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (p.id === currentId ? ' active' : '');
      chip.textContent = p.name || 'Sans nom';
      chip.addEventListener('click', () => {
        currentId = p.id;
        saveCurrent();
        renderProjectsBar();
        renderContent();
      });
      bar.appendChild(chip);
    });

    const addChip = document.createElement('button');
    addChip.className = 'chip add';
    addChip.textContent = '+ Nouveau projet';
    addChip.addEventListener('click', () => {
      const p = defaultProject(`Projet ${projects.length + 1}`);
      projects.push(p);
      currentId = p.id;
      saveProjects();
      saveCurrent();
      renderProjectsBar();
      renderContent();
    });
    bar.appendChild(addChip);
  }

  // ===== CALCULATIONS =====
  function computeResults(p) {
    const totalComponentCost = p.components.reduce((sum, c) => sum + (parseFloat(c.price) || 0), 0);
    const salePriceUSD = parseFloat(p.salePriceUSD) || 0;
    const rate = parseFloat(p.conversionRate) || 0;
    const chargesPct = parseFloat(p.chargesPercent) || 0;
    const quantity = Math.max(parseFloat(p.quantity) || 0, 0);

    const salePriceEUR = salePriceUSD * rate;
    const chargesAmount = salePriceEUR * (chargesPct / 100);
    const netAfterCharges = salePriceEUR - chargesAmount;
    const profitPerUnit = netAfterCharges - totalComponentCost;
    const marginPct = salePriceEUR > 0 ? (profitPerUnit / salePriceEUR) * 100 : 0;

    const totalRevenue = salePriceEUR * quantity;
    const totalCharges = chargesAmount * quantity;
    const totalCost = totalComponentCost * quantity;
    const totalProfit = profitPerUnit * quantity;

    return {
      totalComponentCost, salePriceUSD, rate, chargesPct, quantity,
      salePriceEUR, chargesAmount, netAfterCharges, profitPerUnit, marginPct,
      totalRevenue, totalCharges, totalCost, totalProfit
    };
  }

  // ===== RENDER: MAIN CONTENT =====
  function renderContent() {
    const container = document.getElementById('app-content');
    const p = getCurrent();

    if (!p) {
      container.innerHTML = `
        <div class="no-projects">
          <span class="np-emoji">📊</span>
          Aucun projet pour l'instant.<br>Créez-en un pour commencer.
        </div>`;
      return;
    }

    const r = computeResults(p);

    container.innerHTML = `
      <div class="section">
        <div class="section-label">Nom du projet</div>
        <div class="card">
          <div class="project-name-row">
            <input type="text" id="project-name" value="${escapeHtml(p.name)}" placeholder="Nom du projet">
            <button class="icon-btn" id="delete-project" title="Supprimer le projet">🗑</button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Composants</div>
        <div class="card" id="components-card">
          ${p.components.length === 0 ? '<div class="empty-hint">Aucun composant ajouté</div>' : ''}
          <div id="components-list"></div>
          <button class="add-row-btn" id="add-component">+ Ajouter un composant</button>
          <div class="components-total">
            <span>Coût total des composants</span>
            <span>${fmtEUR.format(r.totalComponentCost)}</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Prix de vente</div>
        <div class="card">
          <div class="field-row">
            <div class="field-label">Prix de vente<span class="field-hint">Montant en dollars</span></div>
            <div class="field-input-wrap">
              <input type="number" inputmode="decimal" step="0.01" id="sale-price" value="${p.salePriceUSD}">
              <span class="unit">$</span>
            </div>
          </div>
          <div class="field-row">
            <div class="field-label">Taux de conversion<span class="field-hint">1 $ = ? €</span></div>
            <div class="field-input-wrap">
              <input type="number" inputmode="decimal" step="0.0001" id="conversion-rate" value="${p.conversionRate}">
              <span class="unit">€</span>
            </div>
          </div>
          <div class="computed-line">Soit <b>${fmtEUR.format(r.salePriceEUR)}</b> par unité</div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Charges</div>
        <div class="card">
          <div class="field-row">
            <div class="field-label">Charges à déduire<span class="field-hint">Frais, commissions, taxes…</span></div>
            <div class="field-input-wrap">
              <input type="number" inputmode="decimal" step="0.1" id="charges-percent" value="${p.chargesPercent}">
              <span class="unit">%</span>
            </div>
          </div>
          <div class="computed-line">Soit <b>${fmtEUR.format(r.chargesAmount)}</b> déduits par unité</div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Quantité</div>
        <div class="card">
          <div class="field-row">
            <div class="field-label">Quantité vendue / produite</div>
            <div class="field-input-wrap">
              <input type="number" inputmode="numeric" step="1" min="0" id="quantity" value="${p.quantity}">
              <span class="unit">u.</span>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Résultat</div>
        <div class="result-hero ${r.totalProfit < 0 ? 'negative' : ''}">
          <div class="result-deco">${r.totalProfit < 0 ? '📉' : '💰'}</div>
          <div class="result-label">Bénéfice total (${r.quantity} unité${r.quantity > 1 ? 's' : ''})</div>
          <div class="result-value">${fmtEUR.format(r.totalProfit)}</div>
          <div class="result-sub">${fmtEUR.format(r.profitPerUnit)} par unité · marge ${fmtPct(r.marginPct)}</div>
          <div class="result-breakdown">
            <div class="result-chip">
              <div class="rc-label">Chiffre d'affaires</div>
              <div class="rc-value">${fmtEUR.format(r.totalRevenue)}</div>
            </div>
            <div class="result-chip">
              <div class="rc-label">Charges totales</div>
              <div class="rc-value">${fmtEUR.format(r.totalCharges)}</div>
            </div>
            <div class="result-chip">
              <div class="rc-label">Coût composants</div>
              <div class="rc-value">${fmtEUR.format(r.totalCost)}</div>
            </div>
            <div class="result-chip">
              <div class="rc-label">Bénéfice / unité</div>
              <div class="rc-value">${fmtEUR.format(r.profitPerUnit)}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="detail-row">
            <span class="dr-label">Prix de vente (par unité)</span>
            <span class="dr-value">${fmtEUR.format(r.salePriceEUR)} <span style="color:var(--text2);font-weight:400;">(${fmtUSD.format(r.salePriceUSD)})</span></span>
          </div>
          <div class="detail-row negative">
            <span class="dr-label">− Charges (${fmtPct(r.chargesPct)})</span>
            <span class="dr-value">− ${fmtEUR.format(r.chargesAmount)}</span>
          </div>
          <div class="detail-row">
            <span class="dr-label">= Revenu net après charges</span>
            <span class="dr-value">${fmtEUR.format(r.netAfterCharges)}</span>
          </div>
          <div class="detail-row negative">
            <span class="dr-label">− Coût des composants</span>
            <span class="dr-value">− ${fmtEUR.format(r.totalComponentCost)}</span>
          </div>
          <div class="detail-row total">
            <span class="dr-label">= Bénéfice net par unité</span>
            <span class="dr-value">${fmtEUR.format(r.profitPerUnit)}</span>
          </div>
          <div class="detail-row total">
            <span class="dr-label">= Bénéfice total (× ${r.quantity})</span>
            <span class="dr-value">${fmtEUR.format(r.totalProfit)}</span>
          </div>
        </div>
      </div>
    `;

    renderComponents();
    bindFieldEvents();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderComponents() {
    const p = getCurrent();
    const list = document.getElementById('components-list');
    if (!list) return;
    list.innerHTML = '';

    p.components.forEach((c, idx) => {
      const row = document.createElement('div');
      row.className = 'component-row';
      row.innerHTML = `
        <input type="text" placeholder="Nom du composant" value="${escapeHtml(c.name)}" data-idx="${idx}" class="comp-name">
        <div class="price-wrap">
          <input type="number" inputmode="decimal" step="0.01" placeholder="0" value="${c.price}" data-idx="${idx}" class="comp-price">
          <span class="unit">€</span>
        </div>
        <button class="remove-btn" data-idx="${idx}" title="Supprimer">✕</button>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll('.comp-name').forEach(el => {
      el.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        p.components[idx].name = e.target.value;
        saveProjects();
        renderProjectsBar();
      });
    });

    list.querySelectorAll('.comp-price').forEach(el => {
      el.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        p.components[idx].price = e.target.value;
        saveProjects();
        refreshResultsOnly();
      });
    });

    list.querySelectorAll('.remove-btn').forEach(el => {
      el.addEventListener('click', (e) => {
        const idx = parseInt(e.target.closest('.remove-btn').dataset.idx, 10);
        p.components.splice(idx, 1);
        saveProjects();
        renderContent();
      });
    });
  }

  function bindFieldEvents() {
    const p = getCurrent();

    document.getElementById('project-name').addEventListener('input', (e) => {
      p.name = e.target.value;
      saveProjects();
      renderProjectsBar();
    });

    document.getElementById('delete-project').addEventListener('click', () => {
      if (!confirm(`Supprimer le projet "${p.name || 'sans nom'}" ?`)) return;
      projects = projects.filter(x => x.id !== p.id);
      if (projects.length === 0) {
        const np = defaultProject('Mon premier projet');
        projects.push(np);
        currentId = np.id;
      } else {
        currentId = projects[0].id;
      }
      saveProjects();
      saveCurrent();
      renderProjectsBar();
      renderContent();
    });

    document.getElementById('add-component').addEventListener('click', () => {
      p.components.push({ name: '', price: '' });
      saveProjects();
      renderContent();
    });

    document.getElementById('sale-price').addEventListener('input', (e) => {
      p.salePriceUSD = e.target.value;
      saveProjects();
      refreshResultsOnly();
    });

    document.getElementById('conversion-rate').addEventListener('input', (e) => {
      p.conversionRate = e.target.value;
      saveProjects();
      refreshResultsOnly();
    });

    document.getElementById('charges-percent').addEventListener('input', (e) => {
      p.chargesPercent = e.target.value;
      saveProjects();
      refreshResultsOnly();
    });

    document.getElementById('quantity').addEventListener('input', (e) => {
      p.quantity = e.target.value;
      saveProjects();
      refreshResultsOnly();
    });
  }

  // Re-render only the computed bits without losing input focus while typing
  function refreshResultsOnly() {
    const active = document.activeElement;
    const activeId = active ? active.id : null;
    const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
    renderContent();
    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) {
        el.focus();
        if (selStart !== null && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selStart); } catch (e) {}
        }
      }
    }
  }

  renderProjectsBar();
  renderContent();
</script>
</body>
</html>

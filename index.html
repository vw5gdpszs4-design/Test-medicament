<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heures">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <title>Suivi d'heures</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --card2: #f2f2f7;
      --blue: #007AFF;
      --green: #34C759;
      --red: #FF3B30;
      --orange: #FF9500;
      --gray: #8e8e93;
      --gray2: #c7c7cc;
      --text: #1d1d1f;
      --text2: #6e6e73;
      --radius: 18px;
      --shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 40px;
    }

    .status-bar { height: env(safe-area-inset-top, 44px); background: var(--bg); }

    .header {
      padding: 12px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
    .header-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }

    .add-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      border: none;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,122,255,0.35);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .add-btn:active { transform: scale(0.92); }

    .section { margin: 0 16px 20px; }
    .section-label {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text2); margin-bottom: 8px; padding-left: 4px;
    }

    /* Global stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 16px 20px;
    }
    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 10px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: 700; color: var(--blue); }
    .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* Project card */
    .project-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 14px;
    }

    .project-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .project-name { font-size: 17px; font-weight: 600; }
    .project-meta { font-size: 12px; color: var(--text2); margin-top: 3px; }

    .project-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .icon-btn:active { transform: scale(0.9); }

    .icon-btn.play { background: rgba(52,199,89,0.12); color: var(--green); }
    .icon-btn.pause { background: rgba(255,149,0,0.14); color: var(--orange); }
    .icon-btn.delete { background: rgba(255,59,48,0.1); color: var(--red); font-size: 13px; }

    .timer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 12px;
      min-height: 18px;
    }
    .timer-row .live { color: var(--orange); font-weight: 600; font-variant-numeric: tabular-nums; }
    .timer-row .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--orange);
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    .progress-bar-track {
      height: 6px;
      background: var(--card2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--green));
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .squares-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    .square {
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--card2);
      border: 1px solid rgba(0,0,0,0.04);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .square:active { transform: scale(0.88); }

    .square.filled {
      background: var(--green);
      border-color: var(--green);
    }

    .square.partial-fill::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: var(--fill, 0%);
      background: rgba(0,122,255,0.55);
      border-radius: 5px 0 0 5px;
    }
    .square.partial-fill { border-color: rgba(0,122,255,0.3); }

    .overtime-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--orange);
      font-weight: 600;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 30px;
      color: var(--text2);
    }
    .empty-state .emoji { font-size: 44px; margin-bottom: 12px; display: block; }
    .empty-state .msg { font-size: 15px; line-height: 1.5; }

    /* Modal / bottom sheet */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }
    .overlay.open { display: flex; }

    .sheet {
      background: var(--card);
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
      box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
    }

    .sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 16px; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--gray2);
      font-size: 16px;
      background: var(--card2);
      color: var(--text);
    }
    .field input:focus { outline: 2px solid var(--blue); }

    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--blue); color: white; }
    .btn.secondary { background: var(--card2); color: var(--text); }
  </style>
</head>
<body>

<div class="status-bar"></div>

<div class="header">
  <div>
    <div class="header-title">Heures</div>
    <div class="header-sub">Suivi du temps passé par projet</div>
  </div>
  <button class="add-btn" id="open-add">＋</button>
</div>

<div class="stats-row" id="stats-row"></div>

<div class="section">
  <div class="section-label">Projets</div>
  <div id="projects-list"></div>
</div>

<!-- Add project sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-title">Nouveau projet</div>
    <div class="field">
      <label for="input-name">Nom du projet</label>
      <input type="text" id="input-name" placeholder="Écriture Livre" maxlength="60">
    </div>
    <div class="field">
      <label for="input-estimated">Estimation (heures)</label>
      <input type="number" id="input-estimated" placeholder="28" min="1" max="500" inputmode="numeric">
    </div>
    <div class="sheet-actions">
      <button class="btn secondary" id="cancel-add">Annuler</button>
      <button class="btn primary" id="confirm-add">Créer</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'hours-tracker-projects-v1';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  let projects = load();

  function createProject(name, estimated) {
    projects.push({
      id: uid(),
      name,
      estimated,
      completed: 0,
      pending: 0,       // fractional seconds banked toward the next hour
      running: false,
      sessionStart: null,
      createdAt: Date.now()
    });
    save();
    render();
  }

  function deleteProject(id) {
    const p = projects.find(x => x.id === id);
    if (!p) return;
    if (!confirm(`Supprimer le projet « ${p.name} » ?`)) return;
    projects = projects.filter(x => x.id !== id);
    save();
    render();
  }

  function applyPending(p) {
    if (p.completed >= p.estimated) return;
    const hoursToAdd = Math.floor(p.pending / 3600);
    if (hoursToAdd > 0) {
      const room = p.estimated - p.completed;
      const add = Math.min(hoursToAdd, room);
      p.completed += add;
      p.pending -= add * 3600;
    }
  }

  function toggleTimer(id) {
    const p = projects.find(x => x.id === id);
    if (!p) return;
    if (p.running) {
      const elapsed = (Date.now() - p.sessionStart) / 1000;
      p.pending += elapsed;
      p.running = false;
      p.sessionStart = null;
      applyPending(p);
    } else {
      if (p.completed >= p.estimated) return;
      p.running = true;
      p.sessionStart = Date.now();
    }
    save();
    render();
  }

  function currentPending(p) {
    let val = p.pending;
    if (p.running) val += (Date.now() - p.sessionStart) / 1000;
    return val;
  }

  function setCompletedByClick(p, index) {
    if (p.running) {
      const elapsed = (Date.now() - p.sessionStart) / 1000;
      p.pending += elapsed;
      p.sessionStart = Date.now();
    }
    if (index < p.completed) p.completed = index;
    else p.completed = Math.min(p.estimated, index + 1);
    p.pending = 0;
    if (p.completed >= p.estimated && p.running) {
      p.running = false;
      p.sessionStart = null;
    }
    save();
    render();
  }

  function fmtHM(totalSeconds) {
    totalSeconds = Math.max(0, Math.floor(totalSeconds));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function fmtDuration(totalSeconds) {
    totalSeconds = Math.max(0, Math.floor(totalSeconds));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    if (h === 0 && m === 0) return 'moins d\'une minute';
    let parts = [];
    if (h > 0) parts.push(`${h} h`);
    if (m > 0) parts.push(`${m} min`);
    return parts.join(' ');
  }

  function renderStats() {
    const el = document.getElementById('stats-row');
    if (projects.length === 0) { el.innerHTML = ''; return; }
    const totalEstimated = projects.reduce((s, p) => s + p.estimated, 0);
    const totalCompleted = projects.reduce((s, p) => s + p.completed, 0);
    const running = projects.filter(p => p.running).length;
    el.innerHTML = `
      <div class="stat-card">
        <div class="stat-num">${totalCompleted}h</div>
        <div class="stat-label">réalisées</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalEstimated}h</div>
        <div class="stat-label">estimées</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${running}</div>
        <div class="stat-label">en cours</div>
      </div>
    `;
  }

  function render() {
    renderStats();
    const list = document.getElementById('projects-list');
    list.innerHTML = '';

    if (projects.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="emoji">⏱️</span>
          <div class="msg">Aucun projet pour l'instant.<br>Créez-en un pour commencer à suivre vos heures.</div>
        </div>
      `;
      return;
    }

    projects.forEach(p => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.dataset.projectId = p.id;

      const pct = Math.round((p.completed / p.estimated) * 100);
      const pending = currentPending(p);
      const overtime = p.completed >= p.estimated && pending > 0;

      const top = document.createElement('div');
      top.className = 'project-top';
      top.innerHTML = `
        <div>
          <div class="project-name">${escapeHtml(p.name)}</div>
          <div class="project-meta">${p.completed} h / ${p.estimated} h estimées · ${pct}%</div>
        </div>
      `;

      const actions = document.createElement('div');
      actions.className = 'project-actions';

      const playBtn = document.createElement('button');
      playBtn.className = 'icon-btn ' + (p.running ? 'pause' : 'play');
      playBtn.textContent = p.running ? '⏸' : '▶';
      playBtn.disabled = !p.running && p.completed >= p.estimated;
      if (playBtn.disabled) playBtn.style.opacity = '0.35';
      playBtn.addEventListener('click', () => toggleTimer(p.id));

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn delete';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => deleteProject(p.id));

      actions.appendChild(playBtn);
      actions.appendChild(delBtn);
      top.appendChild(actions);
      card.appendChild(top);

      const timerRow = document.createElement('div');
      timerRow.className = 'timer-row';
      timerRow.dataset.timerRow = p.id;
      if (p.running) {
        timerRow.innerHTML = `<span class="dot"></span><span>Session en cours :</span> <span class="live" data-live="${p.id}">${fmtHM(pending)}</span>`;
      } else if (pending > 0) {
        timerRow.innerHTML = `<span>En pause · progression vers la prochaine heure :</span> <span class="live">${fmtHM(pending)}</span>`;
      } else {
        timerRow.innerHTML = `<span>Chrono à l'arrêt</span>`;
      }
      card.appendChild(timerRow);

      const track = document.createElement('div');
      track.className = 'progress-bar-track';
      track.innerHTML = `<div class="progress-bar-fill" style="width:${Math.min(100, pct)}%"></div>`;
      card.appendChild(track);

      const grid = document.createElement('div');
      grid.className = 'squares-grid';
      const partialPct = p.completed < p.estimated ? Math.min(100, (pending / 3600) * 100) : 0;

      for (let i = 0; i < p.estimated; i++) {
        const sq = document.createElement('div');
        sq.className = 'square';
        if (i < p.completed) {
          sq.classList.add('filled');
        } else if (i === p.completed && partialPct > 0) {
          sq.classList.add('partial-fill');
          sq.style.setProperty('--fill', partialPct + '%');
        }
        sq.addEventListener('click', () => setCompletedByClick(p, i));
        grid.appendChild(sq);
      }
      card.appendChild(grid);

      if (overtime) {
        const note = document.createElement('div');
        note.className = 'overtime-note';
        note.textContent = `Objectif atteint · +${fmtDuration(pending)} de dépassement`;
        card.appendChild(note);
      }

      list.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Lightweight per-second update for running timers, without a full re-render
  function tick() {
    let structuralChange = false;

    projects.forEach(p => {
      if (!p.running) return;
      const elapsed = (Date.now() - p.sessionStart) / 1000;
      const total = p.pending + elapsed;
      if (Math.floor(total / 3600) > Math.floor(p.pending / 3600) || total >= 3600) {
        p.pending = total;
        p.sessionStart = Date.now();
        const before = p.completed;
        applyPending(p);
        if (p.completed !== before) structuralChange = true;
        if (p.completed >= p.estimated) {
          p.running = false;
          p.sessionStart = null;
          structuralChange = true;
        }
      }
    });

    if (structuralChange) {
      save();
      render();
      return;
    }

    // Update live displays without rebuilding the DOM
    projects.forEach(p => {
      if (!p.running) return;
      const pending = currentPending(p);
      const liveEl = document.querySelector(`[data-live="${p.id}"]`);
      if (liveEl) liveEl.textContent = fmtHM(pending);

      const card = document.querySelector(`[data-project-id="${p.id}"]`);
      if (card && p.completed < p.estimated) {
        const partialPct = Math.min(100, (pending / 3600) * 100);
        let sq = card.querySelector('.square.partial-fill');
        if (!sq) {
          sq = card.querySelectorAll('.square')[p.completed];
          if (sq) sq.classList.add('partial-fill');
        }
        if (sq) sq.style.setProperty('--fill', partialPct + '%');
      }
    });
  }

  // Add-project sheet
  const overlay = document.getElementById('overlay');
  const nameInput = document.getElementById('input-name');
  const estInput = document.getElementById('input-estimated');

  document.getElementById('open-add').addEventListener('click', () => {
    nameInput.value = '';
    estInput.value = '';
    overlay.classList.add('open');
    setTimeout(() => nameInput.focus(), 50);
  });

  document.getElementById('cancel-add').addEventListener('click', () => {
    overlay.classList.remove('open');
  });

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  document.getElementById('confirm-add').addEventListener('click', submitNewProject);
  estInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitNewProject(); });
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') estInput.focus(); });

  function submitNewProject() {
    const name = nameInput.value.trim();
    const estimated = Math.round(parseFloat(estInput.value));
    if (!name) { nameInput.focus(); return; }
    if (!estimated || estimated < 1) { estInput.focus(); return; }
    createProject(name, Math.min(500, estimated));
    overlay.classList.remove('open');
  }

  // Catch up any time elapsed while the page was closed, then start.
  (function init() {
    let changed = false;
    projects.forEach(p => {
      if (p.running) {
        const elapsed = (Date.now() - p.sessionStart) / 1000;
        p.pending += elapsed;
        p.sessionStart = Date.now();
        const before = p.completed;
        applyPending(p);
        if (p.completed !== before) changed = true;
        if (p.completed >= p.estimated) { p.running = false; p.sessionStart = null; changed = true; }
      }
    });
    if (changed) save();
    render();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
